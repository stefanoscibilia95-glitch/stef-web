project:
  type: website
  output-dir: _site
  # Only .qmd files are pages. Without this, Quarto treats every .md in the
  # project as an input and renders it into the site — CLAUDE.md would become
  # a public page at /CLAUDE.html and show up in search and the sitemap.
  render:
    - "*.qmd"
  resources:
    - CNAME
    # SIL OFL 1.1 requires the licence to travel with the font wherever it is
    # redistributed, and serving the .woff2 publicly counts as redistribution.
    - fonts/OFL-Jost.txt
    - fonts/OFL-SourceSerif4.txt

website:
  title: "Stefano Scibilia"
  site-url: "https://stefanoscibilia.com"
  description: "Academic homepage of Stefano Scibilia — research, teaching, and outreach."
  favicon: images/favicon.png
  # Off deliberately. Quarto's search ships ~145 KB of JavaScript plus an index —
  # more than every font on the site combined, and more than the profile photo —
  # to search five pages that are all one navbar click away. It also derives its
  # own colours from $primary rather than $link-color, including a lightened red
  # for match highlights, so it kept reintroducing shades outside the three brand
  # colours. Turning it back on means re-theming it; see _log.md.
  search: false
  back-to-top-navigation: true
  # Without these, a link shared on Bluesky, X, LinkedIn or Slack renders as a
  # bare URL with no title, summary or image. `image:` is the card thumbnail.
  open-graph: true
  twitter-card: true
  image: images/profile.jpg
  navbar:
    # No brand text: it linked to the same place as Home. The site title above is
    # still used for the browser tab and link previews.
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: outreach.qmd
        text: Outreach
      - href: contacts.qmd
        text: Contacts

  page-footer:
    left: "© 2026 Stefano Scibilia"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    # styles.scss goes through the theme pipeline rather than a plain `css:` link,
    # so Quarto compiles it into a content-hashed filename. That means an edit
    # always produces a new URL and can never be served from a stale browser cache.
    theme:
      light: [cosmo, styles.scss, light.scss]
      dark: [darkly, styles.scss, dark.scss]
    toc: true
    toc-depth: 2
    anchor-sections: true
    smooth-scroll: true

editor: visual
